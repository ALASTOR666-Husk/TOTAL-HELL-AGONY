<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Карусель товаров</title>
  <link rel="stylesheet" href="./stile.css">
</head>
<body>
<div class="carousel">
  <img id="product-image" src="" alt="Product Image">
  <h2 id="product-name"></h2>
  <p id="product-description"></p>
  <p><strong>Цена:</strong> <span id="product-price"></span></p>

  <div class="controls">
    <button onclick="prevProduct()">Назад</button>
    <button onclick="nextProduct()">Дальше</button>
  </div>
</div>

<script src="./fat.js"></script>
</body>
</html>
